<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Mburoja</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <header>
    <img src="icons/32.png" width="24" height="24" alt="" />
    <h1 data-i18n="extName">Mburoja</h1>
  </header>
  <main>
    <div class="actions">
      <button id="scan-email" class="btn primary" type="button" data-i18n="scanEmail"></button>
      <button id="scan-page" class="btn ghost" type="button" data-i18n="scanPage"></button>
    </div>
    <p id="status" class="muted" role="status" aria-live="polite"></p>

    <section>
      <h2 data-i18n="popupLast"></h2>
      <div id="last"></div>
    </section>

    <section>
      <h2 data-i18n="popupSettings"></h2>
      <label class="check"><input id="auto" type="checkbox" /> <span data-i18n="autoSubmitLabel"></span></label>
      <p class="muted" data-i18n="whatIsSent"></p>
      <label class="check"><input id="deep" type="checkbox" /> <span data-i18n="deepLabel"></span></label>
      <p class="muted" data-i18n="deepHelp"></p>
      <label class="field"><span data-i18n="thresholdLabel"></span>
        <select id="threshold">
          <option value="40" data-i18n="threshold40"></option>
          <option value="60" data-i18n="threshold60"></option>
          <option value="80" data-i18n="threshold80"></option>
        </select>
      </label>
    </section>

    <section>
      <h2 data-i18n="popupSent"></h2>
      <ul id="sent"></ul>
    </section>
  </main>
  <footer class="muted"><span id="api"></span> · <a id="platform" target="_blank" rel="noopener noreferrer" data-i18n="openPlatform"></a></footer>
  <script src="popup.js"></script>
</body>
</html>
